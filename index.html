<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Bán Hàng & Quản Lý Kho</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #2e7d32; text-align: center; margin-bottom: 15px; font-size: 1.5rem; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px; margin-bottom: 12px; }
        .card h2 { color: #1b5e20; margin: 0; font-size: 1.05rem; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.9rem; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        
        .btn { background: #2e7d32; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        .btn:hover { background: #1b5e20; }
        .btn-sell { background: #d32f2f; }
        .btn-sell:hover { background: #b71c1c; }
        .btn-danger { background: #c62828; padding: 6px 10px; font-size: 0.8rem; width: auto; border-radius: 4px; color: white; border: none; cursor: pointer;}
        .btn-danger:hover { background: #8e0000; }
        .btn-delete-row { background: #e53935; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-delete-row:hover { background: #c62828; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
        th, td { border: 1px solid #e0e0e0; padding: 10px 8px; text-align: left; }
        th { background-color: #e8f5e9; color: #1b5e20; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .full-width { grid-column: span 1; }
        .total-preview { background: #e8f5e9; padding: 12px; border-radius: 6px; font-size: 1.1rem; color: #1b5e20; font-weight: bold; text-align: right; margin-bottom: 12px; }

        @media screen and (max-width: 768px) {
            body { padding: 5px; }
            h1 { font-size: 1.25rem; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QUẢN LÝ KHO & BÁN HÀNG VẬT TƯ</h1>
    
    <div class="grid">
        <!-- 1. Giao diện Bán Hàng (Đã đưa lên đầu) -->
        <div class="card">
            <div class="card-header">
                <h2>1. Giao Diện Bán Hàng (Xuất Kho)</h2>
            </div>
            <form id="sellForm">
                <div class="form-group">
                    <label>Chọn sản phẩm bán</label>
                    <select id="sellProductSelect" required onchange="calculateTotal()">
                    </select>
                </div>
                <div class="form-group">
                    <label>Số lượng bán</label>
                    <input type="number" id="sellQty" min="1" value="1" required oninput="calculateTotal()">
                </div>
                <div class="form-group">
                    <label>Tên khách hàng (Tùy chọn)</label>
                    <input type="text" id="customerName" placeholder="VD: Chú Ba Lúa">
                </div>
                
                <div class="total-preview" id="totalPreview">
                    Tổng tiền: 0 đ
                </div>

                <button type="submit" class="btn btn-sell">Bán Hàng & Đẩy Lên GG Sheet</button>
            </form>
        </div>

        <!-- 2. Form Nhập Sản Phẩm (Đưa xuống dưới) -->
        <div class="card">
            <div class="card-header">
                <h2>2. Thêm Sản Phẩm / Nhập Kho</h2>
            </div>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Tên sản phẩm / Thuốc</label>
                    <input type="text" id="addName" placeholder="VD: NPK 16-16-8, Anvil..." required>
                </div>
                <div class="form-group">
                    <label>Đơn vị tính</label>
                    <select id="addUnit">
                        <option value="Bao">Bao</option>
                        <option value="Chai">Chai</option>
                        <option value="Gói">Gói</option>
                        <option value="Can/Xô">Can / Xô</option>
                        <option value="Kg">Kg</option>
                        <option value="Lít">Lít</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Số lượng có sẵn (Tồn kho)</label>
                    <input type="number" id="addQty" min="0" value="10" required>
                </div>
                <div class="form-group">
                    <label>Giá bán (VNĐ)</label>
                    <input type="number" id="addPrice" placeholder="VD: 150000" required>
                </div>
                <button type="submit" class="btn">Thêm Vào Kho & Đồng Bộ GG Sheet</button>
            </form>
        </div>
    </div>

    <!-- 3. Bảng Kiểm Tra Tồn Kho -->
    <div class="card full-width">
        <div class="card-header">
            <h2>3. Bảng Tồn Kho Hiện Tại</h2>
        </div>
        <div class="table-responsive">
            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên sản phẩm</th>
                        <th>ĐVT</th>
                        <th>Tồn</th>
                        <th>Giá bán</th>
                        <th>Thành tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- 4. Lịch Sử Giao Dịch Bán Hàng -->
    <div class="card full-width">
        <div class="card-header">
            <h2>4. Lịch Sử Bán Hàng</h2>
            <button class="btn-danger" onclick="clearHistory()">Xóa Lịch Sử</button>
        </div>
        <div class="table-responsive">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>SL</th>
                        <th>Đơn giá</th>
                        <th>Tổng tiền</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmfao-aH6RUm6t-8UBiEWOlDjtixg4TMO_wMBv_8-27yACVDXFZAzM7gXurlLC0nq1AA/exec";

    let inventory = JSON.parse(localStorage.getItem('agri_stock')) || [
        { id: 'SP001', name: 'Phân Bón NPK 16-16-8', unit: 'Bao', qty: 50, price: 550000 },
        { id: 'SP002', name: 'Thuốc BVTV Anvil 250ml', unit: 'Chai', qty: 30, price: 120000 },
        { id: 'SP003', name: 'Thuốc Trừ Sâu Regent', unit: 'Gói', qty: 100, price: 22000 }
    ];

    let salesHistory = JSON.parse(localStorage.getItem('agri_history')) || [];

    const addProductForm = document.getElementById('addProductForm');
    const sellForm = document.getElementById('sellForm');
    const inventoryTable = document.getElementById('inventoryTable').querySelector('tbody');
    const historyTable = document.getElementById('historyTable').querySelector('tbody');
    const sellProductSelect = document.getElementById('sellProductSelect');
    const totalPreview = document.getElementById('totalPreview');

    function updateUI() {
        inventoryTable.innerHTML = '';
        sellProductSelect.innerHTML = '<option value="">-- Chọn sản phẩm cần bán --</option>';

        if (inventory.length === 0) {
            inventoryTable.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #777;">Kho trống.</td></tr>`;
        } else {
            inventory.forEach((item, index) => {
                const row = document.createElement('tr');
                const totalValue = item.qty * item.price;
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.unit}</td>
                    <td><strong style="color: ${item.qty <= 5 ? 'red' : 'green'};">${item.qty}</strong></td>
                    <td>${item.price.toLocaleString('vi-VN')} đ</td>
                    <td>${totalValue.toLocaleString('vi-VN')} đ</td>
                    <td><button class="btn-delete-row" onclick="deleteProduct(${index})">Xóa</button></td>
                `;
                inventoryTable.appendChild(row);

                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${item.name} (Còn: ${item.qty} ${item.unit}) - Giá: ${item.price.toLocaleString('vi-VN')}đ`;
                sellProductSelect.appendChild(option);
            });
        }

        historyTable.innerHTML = '';
        if (salesHistory.length === 0) {
            historyTable.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">Chưa có giao dịch.</td></tr>`;
        } else {
            salesHistory.slice().reverse().forEach(record => {
                const hRow = document.createElement('tr');
                hRow.innerHTML = `
                    <td>${record.time}</td>
                    <td>${record.customer}</td>
                    <td><strong>${record.productName}</strong></td>
                    <td>${record.qty} ${record.unit}</td>
                    <td>${record.price.toLocaleString('vi-VN')} đ</td>
                    <td><strong style="color: #2e7d32;">${record.totalMoney.toLocaleString('vi-VN')} đ</strong></td>
                `;
                historyTable.appendChild(hRow);
            });
        }

        localStorage.setItem('agri_stock', JSON.stringify(inventory));
        localStorage.setItem('agri_history', JSON.stringify(salesHistory));
        calculateTotal();
    }

    function deleteProduct(index) {
        const productName = inventory[index].name;
        if (confirm(`Xóa sản phẩm "${productName}" khỏi kho?`)) {
            inventory.splice(index, 1);
            updateUI();
            sendToGoogleSheets({ action: "updateInventory", inventory: inventory });
        }
    }

    function sendToGoogleSheets(payload) {
        if (!GOOGLE_SCRIPT_URL) return;
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(err => console.error("Lỗi đồng bộ:", err));
    }

    function clearHistory() {
        if (salesHistory.length === 0) return;
        if (confirm('Xóa toàn bộ lịch sử bán hàng?')) {
            salesHistory = [];
            localStorage.removeItem('agri_history');
            updateUI();
        }
    }

    function calculateTotal() {
        const productIndex = sellProductSelect.value;
        const sellQty = parseInt(document.getElementById('sellQty').value) || 0;

        if (productIndex === "" || !inventory[productIndex]) {
            totalPreview.textContent = "Tổng tiền: 0 đ";
            return;
        }

        const selectedItem = inventory[productIndex];
        const total = selectedItem.price * sellQty;
        totalPreview.textContent = `Tổng tiền: ${total.toLocaleString('vi-VN')} đ`;
    }

    addProductForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('addName').value;
        const unit = document.getElementById('addUnit').value;
        const qty = parseInt(document.getElementById('addQty').value);
        const price = parseFloat(document.getElementById('addPrice').value);

        const existingProduct = inventory.find(item => item.name.toLowerCase() === name.toLowerCase() && item.unit === unit);
        if (existingProduct) {
            existingProduct.qty += qty;
            existingProduct.price = price;
        } else {
            const newId = 'SP' + String(inventory.length + 1).padStart(3, '0');
            inventory.push({ id: newId, name, unit, qty, price });
        }

        updateUI();
        addProductForm.reset();
        sendToGoogleSheets({ action: "updateInventory", inventory: inventory });
        alert('Đã cập nhật kho thành công!');
    });

    sellForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const productIndex = sellProductSelect.value;
        if (productIndex === "") {
            alert('Vui lòng chọn sản phẩm!');
            return;
        }

        const sellQty = parseInt(document.getElementById('sellQty').value);
        const customer = document.getElementById('customerName').value || 'Khách lẻ';
        let selectedItem = inventory[productIndex];

        if (selectedItem.qty < sellQty) {
            alert(`Không đủ hàng! Tồn kho chỉ còn: ${selectedItem.qty} ${selectedItem.unit}`);
            return;
        }

        selectedItem.qty -= sellQty;
        const totalMoney = sellQty * selectedItem.price;

        const now = new Date();
        const timeString = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN');
        
        const newSale = {
            time: timeString,
            customer: customer,
            productName: selectedItem.name,
            unit: selectedItem.unit,
            qty: sellQty,
            price: selectedItem.price,
            totalMoney: totalMoney
        };

        salesHistory.push(newSale);
        updateUI();

        sendToGoogleSheets({ action: "addSale", sale: newSale });
        sendToGoogleSheets({ action: "updateInventory", inventory: inventory });

        alert(`Bán thành công! Tổng tiền: ${totalMoney.toLocaleString('vi-VN')} đ`);

        document.getElementById('customerName').value = '';
        document.getElementById('sellQty').value = 1;
    });

    updateUI();
</script>

</body>
</html>
